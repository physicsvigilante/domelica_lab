name: Native Motion Lab

on:
  push:
    branches: [main, 'experiment/m4-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: openmodelica/openmodelica:v1.27.1-ompython@sha256:a79649b5b65bc3051b324efa05dbf24af460048d51894447e5e324d52e79c65f
    env:
      MODEL_SOURCE_REVISION: ${{ github.sha }}
      CHECKOUT_REVISION: ${{ github.sha }}
      NATIVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve accepted mechanics sources
        run: python3 scripts/check_m1_baseline.py
      - name: Prepare Modelica Standard Library
        run: omc scripts/install_msl.mos
      - name: Build and simulate motion models
        shell: bash
        run: |
          set -o pipefail
          omc scripts/native_m4.mos | tee m4-native-run.log
      - name: Preserve primary native inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-native-inputs
          if-no-files-found: error
          path: |
            m4_*_res.mat
            m4_*_visual.xml
            m4_*.log
            m4-native-run.log
            m4-native-toolchain.txt
            artifacts/m4_*-completion.json
      - name: Export original native samples and parameters
        timeout-minutes: 5
        run: timeout 240s python3 -u scripts/export_native_csv.py m4_groove_slide m4_two_spring
      - name: Verify independent motion and energy checks
        run: python3 scripts/verify_m4.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build offline motion viewer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:runtime
          python3 scripts/test_native_motion_scene.py --native
          python3 scripts/build_motion_preview.py
      - name: Preserve motion results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-lab-results
          if-no-files-found: warn
          path: |
            m4_*_res.mat
            m4_*_res.csv
            m4_*_visual.xml
            m4_*.log
            m4-native-run.log
            m4-native-toolchain.txt
            artifacts/m4-metrics.json
            artifacts/m4_*-completion.json
            artifacts/motion-preview.html
            artifacts/motion-scenes.json
            artifacts/motion-provenance.json
            artifacts/three-runtime.js
            artifacts/three-runtime.json
            artifacts/three.LICENSE.txt

  browser-motion:
    needs: native-motion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: motion-lab-results
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise offline motion playback
        run: node scripts/check_motion.cjs artifacts/motion-preview.html
      - name: Preserve motion browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-browser-checks
          if-no-files-found: warn
          path: artifacts/motion-checks/
