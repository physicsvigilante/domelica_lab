name: M6B Fixed-Pulley Atwood Composition

on:
  push:
    branches: ['experiment/m6b-*']
    paths:
      - 'DomelicaLab/**'
      - 'viewer/m6b-*.json'
      - 'scripts/check_m6b_atwood.py'
      - '.github/workflows/m6b-atwood-fixed-pulley.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m6a-pendulums-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: openmodelica/openmodelica:v1.27.1-ompython@sha256:a79649b5b65bc3051b324efa05dbf24af460048d51894447e5e324d52e79c65f
    env:
      MODEL_SOURCE_REVISION: ${{ github.sha }}
      CHECKOUT_REVISION: ${{ github.sha }}
      NATIVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce accepted component/exporter/renderer source preservation
        run: python3 scripts/check_m4c_reuse.py
      - name: Prepare pinned Modelica Standard Library
        run: omc scripts/install_msl.mos
      - name: Simulate all four assemblies with the unchanged M5 runner
        timeout-minutes: 12
        run: >-
          python3 scripts/run_experiments.py run
          --manifest viewer/m6b-experiments.json
          --run-dir observation-run --timeout 600
      - name: Focused Atwood string constraint, analytical trajectory, tension and energy checks
        run: >-
          python3 scripts/check_m6b_atwood.py
          --csv observation-run/m6b_atwood_res.csv
          --report artifacts/m6b-physics.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the unchanged 3D force/motion viewer from fresh native recordings
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:runtime
          python3 scripts/build_observation_lab.py --manifest observation-run/experiments.json --results-dir observation-run --output artifacts/m6b-observation-lab.html
      - name: Preserve native evidence and standalone HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6b-native-results
          if-no-files-found: warn
          path: |
            observation-run/*_res.mat
            observation-run/*_res.csv
            observation-run/*_visual.xml
            observation-run/*.log
            observation-run/native-toolchain.txt
            observation-run/run_native.mos
            observation-run/run-plan.json
            observation-run/experiments.json
            observation-run/observations.json
            observation-run/source/
            artifacts/m6b-observation-lab.html
            artifacts/m6b-observation-lab.json
            artifacts/m6b-observation-lab_build.json
            artifacts/m6b-physics.json
            artifacts/three-runtime.js
            artifacts/three-runtime.json
            artifacts/three.LICENSE.txt

  browser-composition:
    needs: native-composition
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m6b-native-results
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned Chromium and browser checker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      - name: Verify four Modelica-recorded scenes in the unchanged M5 viewer
        run: node scripts/check_observation_lab.cjs artifacts/m6b-observation-lab.html artifacts/m6b-browser-checks
      - name: Preserve browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6b-browser-checks
          if-no-files-found: warn
          path: artifacts/m6b-browser-checks/
