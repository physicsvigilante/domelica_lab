name: Native Coupled Motion Lab

on:
  push:
    branches: [main, 'experiment/m4b-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-coupled:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: openmodelica/openmodelica:v1.27.1-ompython@sha256:a79649b5b65bc3051b324efa05dbf24af460048d51894447e5e324d52e79c65f
    env:
      MODEL_SOURCE_REVISION: ${{ github.sha }}
      CHECKOUT_REVISION: ${{ github.sha }}
      NATIVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify reuse of accepted physics and renderers
        run: |
          python3 scripts/check_m1_baseline.py
          python3 scripts/check_m4b_reuse.py
      - name: Prepare Modelica Standard Library
        run: omc scripts/install_msl.mos
      - name: Build and simulate coupled models
        shell: bash
        run: |
          set -o pipefail
          omc scripts/native_m4b.mos | tee m4b-native-run.log
      - name: Preserve primary native inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupled-native-inputs
          if-no-files-found: error
          path: |
            m4b_*_res.mat
            m4b_*_visual.xml
            m4b_*.log
            m4b-native-run.log
            m4b-native-toolchain.txt
            artifacts/m4b_*-completion.json
      - name: Export all native samples and parameters
        timeout-minutes: 5
        run: timeout 240s python3 -u scripts/export_native_csv.py m4b_moving_wedge m4b_spring_wedge
      - name: Verify coupled trajectories and physical balances
        run: python3 scripts/verify_m4b.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build offline coupled-motion viewer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:runtime
          python3 scripts/build_coupled_preview.py
      - name: Preserve coupled results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupled-lab-results
          if-no-files-found: warn
          path: |
            m4b_*_res.mat
            m4b_*_res.csv
            m4b_*_visual.xml
            m4b_*.log
            m4b-native-run.log
            m4b-native-toolchain.txt
            artifacts/m4b-metrics.json
            artifacts/m4b_*-completion.json
            artifacts/coupled-preview.html
            artifacts/coupled-scenes.json
            artifacts/coupled-provenance.json
            artifacts/three-runtime.js
            artifacts/three-runtime.json
            artifacts/three.LICENSE.txt

  browser-coupled:
    needs: native-coupled
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coupled-lab-results
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise both coupled motions in the offline viewer
        run: node scripts/check_coupled.cjs artifacts/coupled-preview.html
      - name: Preserve browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupled-browser-checks
          if-no-files-found: warn
          path: artifacts/coupled-checks/
