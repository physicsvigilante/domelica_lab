name: M6F Incline Moving Pulley - Native/2D

on:
  push:
    branches: ['experiment/m6f-*']
    paths:
      - 'DomelicaLab/**'
      - 'viewer/m6f-*'
      - 'scripts/check_m6f_incline.py'
      - 'scripts/check_m6f_incline.cjs'
      - '.github/workflows/m6f-incline-pulley.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: openmodelica/openmodelica:v1.27.1-ompython@sha256:a79649b5b65bc3051b324efa05dbf24af460048d51894447e5e324d52e79c65f
    env:
      MODEL_SOURCE_REVISION: ${{ github.sha }}
      CHECKOUT_REVISION: ${{ github.sha }}
      NATIVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Protected source reuse
        run: python3 scripts/check_m4c_reuse.py
      - name: Prepare Modelica standard library
        run: omc scripts/install_msl.mos
      - name: One native inclined-pulley simulation
        run: python3 scripts/run_experiments.py run --manifest viewer/m6f-experiments.json --run-dir m6f-run --timeout 300
      - name: Verify native acceleration, tension, energy and rope constraints
        run: python3 scripts/check_m6f_incline.py --csv m6f-run/m6f_incline_res.csv --report artifacts/m6f-physics.json
      - name: Reuse original geometry + viewer to build dark/light HTML
        run: |
          python3 scripts/build_rope2d.py --csv m6f-run/m6f_incline_res.csv --native-manifest m6f-run/experiments.json --routes viewer/m6f-routes.json --style viewer/m6f-style-dark.json --output artifacts/m6f-incline-dark.html
          python3 scripts/build_rope2d.py --csv m6f-run/m6f_incline_res.csv --native-manifest m6f-run/experiments.json --routes viewer/m6f-routes.json --style viewer/m6f-style-light.json --output artifacts/m6f-incline-light.html
      - uses: actions/upload-artifact@v4
        with:
          name: m6f-native-and-html
          path: |
            m6f-run/
            artifacts/m6f-physics.json
            artifacts/m6f-incline-*.html

  browser:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m6f-native-and-html
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      - name: Focused SVG and playback smoke
        run: node scripts/check_m6f_incline.cjs artifacts/m6f-incline-dark.html artifacts/m6f-incline-light.html artifacts/m6f-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6f-browser-checks
          path: artifacts/m6f-browser/
