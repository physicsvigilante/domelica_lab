name: Native Modelica Lab
on:
  pull_request:
  workflow_dispatch:

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: openmodelica/openmodelica:v1.27.1-ompython
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Modelica Standard Library
        run: omc scripts/install_msl.mos
      - name: Build and simulate native models
        run: omc scripts/native_smoke.mos
      - name: Verify physical output independently
        run: python3 scripts/verify_csv.py
      - name: Build offline browser playback from native data
        run: python3 scripts/build_preview.py
      - name: Preserve native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelica-lab-results
          if-no-files-found: warn
          path: |
            m0_*_res.csv
            m0_*.log
            m0_*_visual.xml
            m1_*_res.csv
            m1_*.log
            m1_*_visual.xml
            artifacts/browser-preview.html
