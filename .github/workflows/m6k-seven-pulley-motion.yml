name: M6K Seven Pulley Two-Rope Native Motion

on:
  push:
    branches: ['experiment/m6k-*']
    paths:
      - 'DomelicaLab/**'
      - 'viewer/m6k-*'
      - '.github/workflows/m6k-seven-pulley-motion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: openmodelica/openmodelica:v1.27.1-ompython@sha256:a79649b5b65bc3051b324efa05dbf24af460048d51894447e5e324d52e79c65f
    env:
      MODEL_SOURCE_REVISION: ${{ github.sha }}
      CHECKOUT_REVISION: ${{ github.sha }}
      NATIVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install existing Modelica Standard Library
        run: omc scripts/install_msl.mos
      - name: One 1-second native five-body two-rope run
        run: >-
          python3 scripts/run_experiments.py run
          --manifest viewer/m6k-experiments.json
          --run-dir m6k-run --timeout 500
      - name: Build standalone animation using unchanged native 2D rope viewer
        run: >-
          python3 scripts/build_rope2d.py
          --csv m6k-run/m6k_seven_pulley_res.csv
          --native-manifest m6k-run/experiments.json
          --routes viewer/m6k-routes.json
          --style viewer/m6k-style.json
          --output artifacts/m6k-seven-pulley-motion.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6k-openmodelica-native-seven-pulley-animation
          if-no-files-found: warn
          path: |
            artifacts/
            m6k-run/m6k_seven_pulley_res.csv
            m6k-run/m6k_seven_pulley_res.mat
            m6k-run/native-run.log
            m6k-run/experiments.json
            m6k-run/source/
